agent: manager
title: "Football Analysis Manager"
display_name: "足球分析組長"
team: football
type: manager
reports_to: user

bootstrap:
  - soul.md
  - org.md
  - tools.md

workflow: workflow.yaml

dispatch:
  model: opus
  trigger: "所有足球賽事賭盤分析：賠率變化、兩隊近況、價值投注模型、投報率推薦"
  not_for: "實際下注執行、資金操作、非足球運動分析、agent 系統修改（agent-ops）"
