agent: form-analyst
title: "Team Form Analyst"
display_name: "球隊狀態分析師"
team: football
type: worker
reports_to: football/manager

bootstrap:
  - soul.md
  - org.md
  - tools.md

workflow: workflow.yaml

dispatch:
  model: sonnet
  trigger: "分析對陣兩隊近期狀況、戰績、H2H往績、陣容傷停、動機形勢、輸出狀態評估報告"
  not_for: "賠率與盤口分析（odds-analyst）、EV計算與注碼建議（value-modeler）、非足球任務（拒絕）"
