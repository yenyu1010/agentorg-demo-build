name: Content Designer Workflow
description: Router — 步驟跳轉與條件路由。完整流程邏輯在 workflow/design-flow.md。

error_policy:
  default: diagnose_and_retry
  max_retries: 2
  on_max_retries: report_what_was_done_and_what_failed

steps:
  - id: log_start
    action: shell
    command: scripts/worklog.sh start edu/content-designer
    on_error: continue

  - id: check_memory
    action: read_file
    path: agents/edu/content-designer/memory/MEMORY.md
    description: 讀取過去設計經驗，了解常見結構模式與已知偏好
    on_error: continue

  - id: feedback_detect # self-added 2026-04-26
    action: manager_self
    note: "偵測 content-evaluator 退回 REVISE 時的回饋語意，觸發 memory 保存，記錄被退回的設計決策"
    on_error: continue

  - id: run_design_flow
    action: follow
    ref: agents/edu/content-designer/workflow/design-flow.md
    on_error:
      action: diagnose_and_retry
      max_attempts: 2
      on_max: report_what_was_done_and_what_failed

  - id: save_memory
    action: write_memory
    description: 儲存本次設計的新發現（成功結構、格式偏好、錯誤教訓）
    path: agents/edu/content-designer/memory/MEMORY.md
    condition: "evaluator_returned_revise == true OR new_audience_pattern_observed == true"
    on_error: continue

  - id: log_end
    action: shell
    command: scripts/worklog.sh end edu/content-designer
    on_error: continue

references:
  - agents/edu/content-designer/soul.md
  - agents/edu/content-designer/tools.md
  - agents/edu/content-designer/workflow/design-flow.md
